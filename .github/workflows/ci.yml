name: Verify application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -c requirements.lock '.[dev]'
      - run: ruff check studio tests
      - run: node --check studio/static/app.js
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://studio:test-only-password@localhost:5432/studio_test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - name: Run container smoke workflow
        run: python tests/container_smoke.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Exercise browser workflow
        run: python tests/browser_smoke.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: artifacts/browser
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Shut down
        if: always()
        run: docker compose down -v
