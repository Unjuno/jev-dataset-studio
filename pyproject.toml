[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-dataset-studio"
version = "1.0.0"
description = "A visual workspace for Jev-powered dataset annotation, review, and export"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.9,<3", "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1",
  "psycopg[binary]>=3.2,<4", "regex>=2024.11", "pyarrow>=18"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "httpx2>=2,<3"]

[project.scripts]
jev-studio = "studio.__main__:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
